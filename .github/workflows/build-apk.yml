name: Build QingJianIME APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解压工程
        shell: bash
        run: |
          mkdir -p source
          unzip -q QingJianIME-Android-v1.0.0.zip -d source

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: 接受 Android SDK 许可证
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: 安装 Android SDK
        shell: bash
        run: |
          sdkmanager platform-tools
          sdkmanager 'platforms;android-35'
          sdkmanager 'build-tools;35.0.0'

      - name: 配置 AndroidX
        working-directory: source
        shell: bash
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: 配置 Java 17
        working-directory: source
        shell: bash
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: 编译 APK
        working-directory: source
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 查找 APK
        shell: bash
        run: |
          echo "===== APK 文件 ====="
          find source -type f -name "*.apk" -print
          echo "===================="

      - name: 验证 APK
        shell: bash
        run: |
          if ! find source -type f -name "*.apk" | grep -q ".apk"; then
            echo "错误：没有找到 APK"
            exit 1
          fi
          echo "APK 已成功生成"
