name: Build QingJianIME APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. 下载项目
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 解压 Android 工程
      - name: 解压工程
        run: |
          mkdir -p source
          unzip -q QingJianIME-Android-v1.0.0.zip -d source

      # 3. 设置 JDK 17
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. 设置 Android SDK
      - name: 设置 Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      # 5. 接受 Android SDK 许可证
      - name: 接受 Android SDK 许可证
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 6. 安装 Android SDK
      - name: 安装 Android SDK 组件
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 7. 设置 Gradle
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

