name: Build QingJianIME APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解压工程
        shell: bash
        run: |
          mkdir -p source
          unzip -q QingJianIME-Android-v1.0.0.zip -d source

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: 接受 Android SDK 许可证
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: 安装 Android SDK
        shell: bash
        run: |
          sdkmanager platform-tools
          sdkmanager 'platforms;android-35'
          sdkmanager 'build-tools;35.0.0'

      - name: 修复 Java 和 Kotlin JVM 版本
        working-directory: source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # 删除旧的 kotlinOptions 配置
          text = text.replace(
              '    kotlinOptions { jvmTarget = "17" }\n',
              ''
          )

          # 在 android {} 中加入 Java 17 工具链和 Kotlin 17
          marker = '    defaultConfig {'

          insert = '''    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlin {
              jvmToolchain(17)
          }

          '''

          if 'compileOptions {' not in text:
              text = text.replace(marker, insert + marker)

          p.write_text(text)

          print("===== 修复后的 app/build.gradle.kts =====")
          print(text)
          PY

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: 配置 AndroidX
        working-directory: source
        shell: bash
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: 编译 APK
        working-directory: source
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 查找 APK
        shell: bash
        run: |
          echo "========== APK =========="
          find source -type f -name "*.apk" -print
          echo "========================="

      - name: 验证 APK
        shell: bash
        run: |
          APK_COUNT=$(find source -type f -name "*.apk" | wc -l)

          echo "找到 APK：$APK_COUNT 个"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "错误：APK 没有生成"
            exit 1
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: QingJianIME-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
